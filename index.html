<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0ea5e9">
    <title>B.C 9.0 - Proyecto Black</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="user-profile-panel" class="side-panel">
    <h3>Identidad B.C</h3>
    <div style="background: #0f172a; padding: 10px; border: 1px solid #0ea5e9; text-align: center; border-radius: 5px; margin-bottom: 10px;">
        <small style="color: #0ea5e9;">ID DE CUENTA:</small><br>
        <span id="userIdDisplay" style="font-weight: bold; letter-spacing: 2px;">SIN VINCULAR</span>
    </div>

    <input type="text" id="userName" placeholder="Nombre (Solo letras)" autocomplete="name">
    <input type="number" id="userAge" placeholder="Edad" autocomplete="age">
    
    <select id="userGender">
        <option value="General">Género</option>
        <option value="Hombre">Hombre</option>
        <option value="Mujer">Mujer</option>
        <option value="Otro">Otro</option>
    </select>
    
    <button onclick="saveProfile()">Guardar Cuenta</button>

    <hr style="border: 0; border-top: 1px solid #334155; margin: 15px 0;">
    
    <input type="text" id="loginId" placeholder="Ingresa ID de 10 dígitos" autocomplete="off">
    <button onclick="loginWithId()" style="background: #f472b6;">Recuperar Cuenta</button>
</div>

<div class="chat-container">
    <div class="chat-header">B.C 9.0 🚀 [BLACK CHAT]</div>
    <div id="messages" class="chat-messages"></div>
    <div class="chat-input">
        <input type="text" id="userInput" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="sendBtn">Enviar</button>
        <button onclick="clearMemory()" style="background: #ef4444;">Reiniciar</button>
    </div>
</div>

<div id="social-panel" class="side-panel">
    <h3>Comunidad Black</h3>
    <div class="social-btns" style="display:flex; gap:10px; justify-content:center;">
        <button onclick="like()">👍 <span id="likeCount">0</span></button>
        <button onclick="dislike()">👎 <span id="dislikeCount">0</span></button>
    </div>
    
    <div id="comments-section" style="margin-top: 15px;">
        <h4>Comentarios</h4>
        <div id="comments-list" style="height: 200px; overflow-y: auto; background: #0f172a; padding: 10px; border-radius: 5px; border: 1px solid #334155; margin-bottom: 10px;">
            </div>
        <input type="text" id="commentInput" placeholder="Añade tu opinión..." autocomplete="off">
        <button onclick="addComment()" style="width: 100%; margin-top: 5px;">Publicar</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
